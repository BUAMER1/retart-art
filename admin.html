<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة RETART</title><style>body{background:#0b1445;color:#eef3ff;font:16px system-ui;margin:24px}main{max-width:1000px;margin:auto}h1,h2{color:#f4c430}input,button,select{font:inherit;padding:10px;border-radius:8px;border:1px solid #2b3d86}button{background:#f4c430;cursor:pointer}article{background:#14236b;padding:18px;border-radius:12px;margin:12px 0;overflow-wrap:anywhere}p{white-space:pre-wrap}select{margin:5px} </style><main><h1>RETART | إدارة الطلبات</h1><form id="login"><input id="pw" type="password" required placeholder="كلمة مرور الإدارة" autocomplete="current-password"><button>دخول / تحديث</button></form><p id="msg" role="status"></p><h2 id="stats"></h2><section id="orders"></section></main><script>
let password='';const $=id=>document.getElementById(id);const states={new:'جديد',processing:'قيد التجهيز',shipped:'تم الشحن',completed:'مكتمل',cancelled:'ملغي'},payments={pending:'بانتظار المراجعة',paid:'مدفوع',rejected:'مرفوض'},names={mug:'مق',case:'كفر',plate:'صحن',canvas:'لوحة',card:'بطاقة'};function el(tag,text,parent){const n=document.createElement(tag);n.textContent=text;parent.append(n);return n}function select(map,value,parent){const s=el('select','',parent);for(const [k,v] of Object.entries(map)){const o=el('option',v,s);o.value=k;o.selected=k===value}return s}async function api(method='GET',data){const r=await fetch('/api/orders',{method,headers:{Authorization:'Bearer '+password,'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});if(!r.ok)throw Error('تعذر الاتصال أو كلمة المرور غير صحيحة');return r.json()}async function load(){try{const rows=await api();$('orders').replaceChildren();$('msg').textContent='تم تحميل الطلبات (آخر 500 طلب)';$('stats').textContent='الطلبات: '+rows.length+' | المبيعات المدفوعة: '+rows.filter(r=>r.payment_status==='paid'&&r.order_status!=='cancelled').reduce((a,r)=>a+r.total,0)+' ر.س';for(const r of rows){const a=el('article','',$('orders'));el('h3',r.order_number,a);el('p',[r.created_at,r.customer_name,r.phone,r.city,r.address,r.notes].filter(Boolean).join('\n'),a);let desc=r.products;try{const p=JSON.parse(desc);desc=p.items.map(i=>(names[i.id]||i.id)+' × '+i.qty+' '+i.color+(i.id==='canvas'?(i.sizeIdx===1?' 30×40':' 20×30'):'')+' — '+i.price+' ر.س للوحدة').join('\n')+(p.gift?'\nتغليف هدية: 10 ر.س':'')}catch{}el('p',desc,a);el('p','المنتجات: '+r.subtotal+' | الشحن: '+r.shipping+' | الإجمالي: '+r.total+' ر.س',a);const s=select(states,r.order_status,a),p=select(payments,r.payment_status,a),b=el('button','حفظ الحالة',a);b.onclick=async()=>{try{await api('PATCH',{id:r.id,order_status:s.value,payment_status:p.value});await load()}catch(e){$('msg').textContent=e.message}}}}catch(e){$('orders').replaceChildren();$('stats').textContent='';$('msg').textContent=e.message}}$('login').onsubmit=e=>{e.preventDefault();if($('pw').value)password=$('pw').value;$('pw').value='';load()};</script></html>
