<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>RETART | الإدارة</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1445;color:#eef3ff;font:16px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #34468b;padding-bottom:16px}h1,h2,h3{margin:0;color:#f4c430}small,label{color:#b3c2ea}button,input,select{font:inherit;padding:10px 12px;border:1px solid #34468b;border-radius:9px;background:#101c58;color:#eef3ff}button{background:#f4c430;color:#171400;font-weight:bold;cursor:pointer}button.alt{background:transparent;color:#eef3ff}button.danger{background:transparent;color:#ffaaaa;border-color:#a65b70}button:disabled{opacity:.5;cursor:not-allowed}.panel,article,.metric{background:#14236b;border:1px solid #34468b;border-radius:14px;padding:18px}.panel{margin:20px 0}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}.metric strong{display:block;font-size:26px;color:#f4c430;margin-top:8px}.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar input{flex:1;min-width:180px}article{margin:12px 0;overflow-wrap:anywhere}article h3{font-size:17px}p{white-space:pre-wrap;line-height:1.7}.details{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.muted{color:#b3c2ea;font-size:13px}.tag{border:1px solid #6374ac;border-radius:20px;padding:4px 10px;font-size:13px}.total{color:#f4c430;font-weight:bold}.actions{border-top:1px solid #34468b;padding-top:12px} [hidden]{display:none!important}#msg{color:#f4c430}a{color:#f4c430}#login input{max-width:100%}</style></head><body><main><header><div><small>RETART • لوحة الإدارة</small><h1>إدارة الطلبات</h1></div><div class="toolbar"><a href="/">المتجر</a><button class="alt" id="logout" hidden>خروج</button></div></header><form id="login" class="panel"><h2>تسجيل الدخول</h2><p class="muted">استخدم كلمة مرور الإدارة في Cloudflare.</p><input id="pw" type="password" required autocomplete="current-password" placeholder="كلمة المرور"><button>دخول</button></form><p id="msg" role="status"></p><section id="dashboard" hidden><section class="panel"><h2>إدارة المنتجات</h2><button id="catalogLoad" type="button">تحميل المنتجات</button><div id="catalogRows"></div><button id="catalogSave" type="button" hidden>حفظ التغييرات</button><p id="catalogMsg" role="status"></p></section><div id="metrics" class="metrics"></div><div class="toolbar"><input id="search" placeholder="بحث بالاسم أو الجوال أو رقم الطلب"><select id="state"><option value="">كل حالات الطلب</option></select><select id="payment"><option value="">كل حالات الدفع</option></select><button id="refresh" class="alt">تحديث</button></div><p class="muted" id="count"></p><section id="orders"></section></section></main><script>
const $=id=>document.getElementById(id), states={new:'جديد',processing:'قيد التجهيز',shipped:'تم الشحن',completed:'مكتمل',cancelled:'ملغي'},payments={pending:'بانتظار المراجعة',paid:'مدفوع',rejected:'مرفوض'},names={mug:'مق',case:'كفر',plate:'صحن',canvas:'لوحة',card:'بطاقة'};let password='',rows=[],generation=0;const money=n=>Number(n).toLocaleString('ar-SA')+' ر.س';function el(t,v,p,c){const n=document.createElement(t);n.textContent=v;if(c)n.className=c;p.append(n);return n}function options(s,map){for(const [k,v] of Object.entries(map)){const o=el('option',v,s);o.value=k}}options($('state'),states);options($('payment'),payments);function select(map,v,p,label){const s=el('select','',p);options(s,map);s.value=v;s.setAttribute('aria-label',label);return s}async function api(method='GET',data){const r=await fetch('/api/orders',{method,cache:'no-store',headers:{Authorization:'Bearer '+password,'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});if(r.status===401)throw Error('كلمة المرور غير صحيحة');if(!r.ok)throw Error('تعذر تنفيذ العملية');return r.json()}function logout(){$('catalogRows').replaceChildren();$('catalogSave').hidden=true;generation++;password='';rows=[];$('orders').replaceChildren();$('metrics').replaceChildren();$('dashboard').hidden=true;$('logout').hidden=true;$('login').hidden=false;$('pw').value='';$('msg').textContent='';}async function load(){const g=generation;try{const result=await api();if(g!==generation)return;if(!Array.isArray(result))throw Error('استجابة غير صحيحة');rows=result;$('dashboard').hidden=false;$('logout').hidden=false;$('login').hidden=true;$('msg').textContent='تم تحميل الطلبات';render()}catch(e){if(g===generation){logout();$('msg').textContent=e.message}}}function render(){const m=$('metrics');m.replaceChildren();for(const [label,value] of [['الطلبات',rows.length],['جديدة',rows.filter(r=>r.order_status==='new').length],['قيد التجهيز',rows.filter(r=>r.order_status==='processing').length],['المبيعات المدفوعة',money(rows.filter(r=>r.payment_status==='paid'&&r.order_status!=='cancelled').reduce((a,r)=>a+r.total,0))]]){const b=el('div','',m,'metric');el('small',label,b);el('strong',value,b)}const q=$('search').value.trim().toLowerCase();const filtered=rows.filter(r=>[r.customer_name,r.phone,r.order_number,r.city].some(v=>String(v).toLowerCase().includes(q))&&(!$('state').value||r.order_status===$('state').value)&&(!$('payment').value||r.payment_status===$('payment').value));$('count').textContent=`عرض ${filtered.length} من ${rows.length} (آخر 500 طلب)`;const list=$('orders');list.replaceChildren();if(!filtered.length)el('p','لا توجد طلبات مطابقة',list);for(const r of filtered){const a=el('article','',list);el('h3',r.order_number,a);el('p',r.created_at+' UTC • '+(states[r.order_status]||r.order_status)+' • '+(payments[r.payment_status]||r.payment_status),a,'muted');const d=el('div','',a,'details'),c=el('div','',d),p=el('div','',d);el('h3','بيانات العميل',c);el('p',[r.customer_name,r.phone,r.city,r.address,r.notes].filter(Boolean).join('\n'),c);el('h3','تفاصيل المنتجات',p);let desc=r.products;try{const x=JSON.parse(desc);desc=x.items.map(i=>(i.name||names[i.id]||i.id)+' × '+i.qty+' '+i.color+(i.id==='canvas'?(i.sizeIdx===1?' 30×40':' 20×30'):'')+' — '+money(i.price)+' للوحدة').join('\n')+(x.gift?'\nتغليف هدية: 10 ر.س':'')+(x.delivery?'\nالتوصيل: '+({smsa:'سمسا',aramex:'أرامكس',jeddah:'مندوب جدة'}[x.delivery]||''):'')}catch{}el('p',desc,p);el('p','المنتجات: '+money(r.subtotal)+' | الشحن: '+money(r.shipping)+' | الإجمالي: '+money(r.total),a,'total');el('p','تحقق من وصول التحويل فعليًا قبل تأكيد الدفع.',a,'muted');if(r.has_receipt){const rb=el('button','تحميل الإيصال الخاص',a,'alt');rb.onclick=async()=>{try{const res=await fetch('/api/receipt?id='+r.id,{headers:{Authorization:'Bearer '+password},cache:'no-store'});if(!res.ok)throw Error();const blob=await res.blob(),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='receipt-'+r.order_number+({'image/jpeg':'.jpg','image/png':'.png','application/pdf':'.pdf'}[blob.type]||'');link.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}catch{$('msg').textContent='تعذر تحميل الإيصال'}};}else el('p','لا يوجد إيصال محفوظ لهذا الطلب',a,'muted');const ac=el('div','',a,'actions'),s=select(states,r.order_status,ac,'حالة الطلب'),pay=select(payments,r.payment_status,ac,'حالة الدفع'),b=el('button','حفظ الحالة',ac);b.onclick=async()=>{if(pay.value==='paid'&&r.payment_status!=='paid'&&!confirm('هل تحققت من وصول التحويل فعليًا؟'))return;b.disabled=true;try{await api('PATCH',{id:r.id,order_status:s.value,payment_status:pay.value});await load()}catch(e){$('msg').textContent=e.message}finally{b.disabled=false}};if(r.payment_status!=='paid'){const del=el('button','حذف طلب تجريبي',ac,'danger');del.onclick=async()=>{if(!confirm('حذف هذا الطلب نهائيًا؟ استخدم هذا الخيار للطلبات التجريبية فقط.'))return;del.disabled=true;try{await api('DELETE',{id:r.id});await load()}catch(e){$('msg').textContent=e.message}finally{del.disabled=false}}}}} $('login').onsubmit=e=>{e.preventDefault();password=$('pw').value;$('pw').value='';load()};$('logout').onclick=logout;$('refresh').onclick=load;for(const id of ['search','state','payment'])$(id).addEventListener('input',render);
let catalogRows=[];
$('catalogLoad').onclick=async()=>{try{const r=await fetch('/api/products',{cache:'no-store'});if(!r.ok)throw Error();catalogRows=await r.json();const root=$('catalogRows');root.replaceChildren();for(const row of catalogRows){const a=document.createElement('article');root.append(a);el('h3',names[row.id],a);for(const [key,title] of [['name','اسم المنتج بالعربي'],['description','الوصف بالعربي'],['nameEn','اسم المنتج بالإنجليزي'],['descriptionEn','الوصف بالإنجليزي']]){const label=el('label',title,a);label.style.display='block';label.style.margin='10px 0';const input=document.createElement(key.startsWith('description')?'textarea':'input');input.maxLength=key.startsWith('name')?100:500;input.value=row[key]||'';input.style.cssText='display:block;width:100%;padding:10px;border:1px solid #34468b;border-radius:9px;background:#101c58;color:#eef3ff;font:inherit';input.oninput=()=>row[key]=input.value;label.append(input);}for(const key of row.id==='canvas'?['price','large']:['price']){const label=el('label',key==='large'?'سعر المقاس الكبير':'السعر بالريال',a);const input=document.createElement('input');input.type='number';input.min=1;input.max=100000;input.value=row[key];input.oninput=()=>row[key]=Number(input.value);label.append(input);}const label=el('label','إخفاء المنتج ',a);const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!row.hidden;cb.onchange=()=>row.hidden=cb.checked;label.append(cb);}$('catalogSave').hidden=false;$('catalogMsg').textContent='';}catch{$('catalogMsg').textContent='تعذر تحميل المنتجات';}};
$('catalogSave').onclick=async()=>{try{const r=await fetch('/api/products',{method:'PUT',headers:{Authorization:'Bearer '+password,'Content-Type':'application/json'},body:JSON.stringify(catalogRows)});if(!r.ok)throw Error();$('catalogMsg').textContent='تم حفظ التغييرات';}catch{$('catalogMsg').textContent='تعذر الحفظ. تأكد من الأسماء والأوصاف والأسعار وبقاء منتج واحد ظاهر على الأقل.';}};
</script></body></html>
