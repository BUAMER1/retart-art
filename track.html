y)return;busy=true;render();try{if(!/^[a-f0-9-]{72}$/.test(token))throw Error();const r=await fetch('/api/track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token}),cache:'no-store',signal:AbortSignal.timeout(15000)});if(!r.ok){if(r.status===404)data=null;throw Error()}data=await r.json();updated=new Date();failed=false}catch{failed=true}finally{busy=false;render()}}$('lang').onclick=()=>{lang=lang==='ar'?'en':'ar';render()};$('refresh').onclick=load;load();setInterval(()=>{if(!document.hidden)load()},30000);
