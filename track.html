<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>RETART | تتبع الطلب</title><style>body{background:#14236b;color:#eef3ff;font:17px system-ui;margin:0}main{max-width:500px;margin:40px auto;padding:24px}section{border:1px solid #6675a8;border-radius:16px;padding:20px}h1,a{color:#f4c430}li{padding:12px}button{font:inherit;padding:12px;background:#f4c430;border:0;border-radius:8px}</style><main><h1>RETART | تتبع طلبك</h1><section><h2 id="num">حالة الطلب</h2><p id="payment"></p><ol id="steps"></ol><p id="msg" role="status"></p><p>مدة التجهيز 3–7 أيام بخلاف الشحن.</p><button id="refresh">تحديث الحالة</button></section><p>احتفظ بهذا الرابط الخاص ولا تشاركه مع الآخرين.</p><a href="/">العودة للمتجر</a></main><script>const $=id=>document.getElementById(id),token=location.hash.slice(1);async function load(){try{const r=await fetch('/api/track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token}),cache:'no-store'});if(!r.ok)throw Error();const x=await r.json();$('num').textContent=x.order_number;$('payment').textContent='الدفع: '+({pending:'بانتظار المراجعة',paid:'تم التأكيد',rejected:'مرفوض'}[x.payment_status]||'');const states=['new','processing','shipped','completed'],labels=['تم استلام الطلب','جاري التجهيز','تم الشحن','تم التسليم'];$('steps').replaceChildren();if(x.order_status==='cancelled')$('msg').textContent='الطلب ملغي';else{$('msg').textContent='';labels.forEach((label,i)=>{const li=document.createElement('li');li.textContent=(i<=states.indexOf(x.order_status)?'✓ ':'○ ')+label;$('steps').append(li)})}}catch{$('msg').textContent='تعذر عرض الطلب. تأكد من الرابط الخاص وحاول مجددًا.'}}$('refresh').onclick=load;load();setInterval(load,30000);</script></html>
